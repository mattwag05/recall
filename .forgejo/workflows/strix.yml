name: Strix Security Scan

# Agentic AI pentest via Strix, driven by a local LLM (zero cost).
# Runs on the docker-host host-executor (Strix spawns its own sandbox container).
# Uses the pre-built ~/strix-venv on the runner host (openai pinned to 2.26.0 for the
# openai-agents 0.14.6 usage-schema compatibility). Exit 2 = vulns found = job fails.

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [quick, deep]
        default: quick
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 8 * * 1"   # Mon 08:30 UTC = 04:30 ET (staggered: 4th of 5, after agentic-crm)

jobs:
  strix:
    runs-on: docker-host
    # was unbounded -> a hung scan burned the runner's 3h ceiling (Tutor
    # 2026-07-20). Kills a hang ~2h sooner; on timeout the run is 'cancelled'
    # and skips the alert steps below, so the pironman red-main watcher is the
    # backstop alert for that case. 2026-07-23.
    timeout-minutes: 90
    steps:
      - name: Guard — require LLM key
        run: |
          if [ -z "${{ secrets.STRIX_LLM_KEY }}" ]; then
            echo "STRIX_LLM_KEY not set — refusing to run."; exit 1
          fi

      - name: Preflight — LLM reachability probe
        id: preflight
        run: |
          set +e
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            -H "Authorization: Bearer ${{ secrets.STRIX_LLM_KEY }}" \
            "${{ vars.LLM_API_BASE }}/models")
          rc=$?
          # Unreachable = curl failed OR HTTP 000 (no response). ANY answered
          # status (401/403/404/500 …) = the host is awake = reachable.
          if [ "$rc" -ne 0 ] || [ "$CODE" = "000" ]; then
            echo "llm_up=false" >> "$GITHUB_OUTPUT"
            echo "LLM host unreachable (curl rc=$rc, http=$CODE) — skipping scan."
          else
            echo "llm_up=true" >> "$GITHUB_OUTPUT"
            echo "LLM host reachable (http=$CODE) — proceeding."
          fi

      - name: Checkout
        if: steps.preflight.outputs.llm_up == 'true'
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset LLM engine (fresh memory headroom)
        if: steps.preflight.outputs.llm_up == 'true'
        run: |
          MODEL="${{ vars.STRIX_LLM }}"; MODEL="${MODEL#openai/}"
          curl -s --max-time 30 -X POST \
            -H "Authorization: Bearer ${{ secrets.STRIX_LLM_KEY }}" \
            "${{ vars.LLM_API_BASE }}/models/$MODEL/unload" >/dev/null || true

      - name: Scan
        id: scan
        if: steps.preflight.outputs.llm_up == 'true'
        run: |
          MODE="${{ github.event.inputs.mode || 'quick' }}"
          MAX_FILES=20
          MODEL="${{ vars.STRIX_LLM }}"; MODEL="${MODEL#openai/}"
          unload() {
            curl -s --max-time 30 -X POST \
              -H "Authorization: Bearer ${{ secrets.STRIX_LLM_KEY }}" \
              "${{ vars.LLM_API_BASE }}/models/$MODEL/unload" >/dev/null || true
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHUNKS="origin/${{ github.base_ref }} HEAD"
          else
            BASE=$(git rev-list -1 --before="7 days ago" HEAD)
            [ -n "$BASE" ] || BASE=$(git rev-parse HEAD~1)
            if [ "$(git diff --name-only "$BASE" HEAD | wc -l)" -eq 0 ]; then
              echo "No commits in the last 7 days (base $BASE) — nothing to scan."
              exit 0
            fi
            # Split the window into commit ranges of <= MAX_FILES files, each scanned
            # at its own tip with the engine unloaded in between, so KV growth is
            # bounded per chunk instead of accumulating across the whole window.
            # Commit ranges, not file lists: --diff-base is strix's only scope knob and
            # a further-back base always yields a SUPERSET, so both ends must move.
            # FLOOR: a single commit larger than MAX_FILES cannot be subdivided this
            # way (recall has one touching 38 files). Going below that needs file-level
            # scoping via --instruction, which bypasses strix's own diff machinery.
            CHUNKS=""
            cb="$BASE"; prev=""
            for c in $(git rev-list --reverse "$BASE"..HEAD); do
              n=$(git diff --name-only "$cb" "$c" | wc -l)
              if [ "$n" -gt "$MAX_FILES" ] && [ -n "$prev" ]; then
                CHUNKS="$CHUNKS $cb $prev"; cb="$prev"
              fi
              prev="$c"
            done
            [ "$(git diff --name-only "$cb" "$prev" | wc -l)" -eq 0 ] || CHUNKS="$CHUNKS $cb $prev"
          fi

          ORIG=$(git rev-parse HEAD)
          restore() { git checkout -q "$ORIG" 2>/dev/null || true; }
          trap restore EXIT

          worst=0; sev_all=""; i=0
          set -- $CHUNKS
          total=$(( $# / 2 ))
          echo "Scanning $total chunk(s), max $MAX_FILES files each"
          while [ "$#" -ge 2 ]; do
            cbase="$1"; ctip="$2"; shift 2; i=$((i+1))
            nf=$(git diff --name-only "$cbase" "$ctip" | wc -l)
            echo "::group::chunk $i/$total  base=${cbase:0:8} tip=${ctip:0:8}  ${nf} files"
            git checkout -q "$ctip"
            unload    # fresh KV per chunk — this is the point of chunking
            set +e
            "$HOME/strix-venv/bin/strix" -n -t "$PWD" --scan-mode "$MODE" \
              --scope-mode diff --diff-base "$cbase" 2>&1 | tee "strix-$i.txt"
            rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            echo "chunk $i rc=$rc"
            if [ "$rc" = "2" ]; then
              LINE=$(sed 's/\x1b\[[0-9;]*m//g' "strix-$i.txt" | grep -E 'Vulnerabilities +[A-Z]+:' | tail -1)
              SEV=$(echo "$LINE" | grep -oE '(CRITICAL|HIGH|MEDIUM|LOW): *[0-9]+' | tr '\n' ' ')
              if [ -z "$SEV" ]; then
                echo "::error::chunk $i: could not parse the severity summary — failing closed."
                worst=2; sev_all="$sev_all UNPARSED"
              else
                sev_all="$sev_all $SEV"
                case "$SEV" in *CRITICAL:*|*HIGH:*) worst=2 ;; esac
              fi
            elif [ "$rc" != "0" ]; then
              # infra/model crash — report the real rc, do not mask it as findings
              echo "rc=$rc" >> "$GITHUB_OUTPUT"
              echo "severity=$sev_all" >> "$GITHUB_OUTPUT"
              exit "$rc"
            fi
          done

          echo "rc=$worst" >> "$GITHUB_OUTPUT"
          echo "severity=$sev_all" >> "$GITHUB_OUTPUT"
          echo "Strix severity summary across $total chunk(s): ${sev_all:-none}"
          [ "$worst" = "2" ] && exit 2
          case "$sev_all" in
            *LOW:*|*MEDIUM:*) echo "::warning::Strix findings are LOW/MEDIUM only ($sev_all) -- advisory, not failing the job." ;;
          esac
          exit 0
        env:
          STRIX_LLM: ${{ vars.STRIX_LLM }}
          LLM_API_BASE: ${{ vars.LLM_API_BASE }}
          LLM_API_KEY: ${{ secrets.STRIX_LLM_KEY }}

      - name: Free LLM engine after scan
        if: always()
        run: |
          MODEL="${{ vars.STRIX_LLM }}"; MODEL="${MODEL#openai/}"
          curl -s --max-time 30 -X POST \
            -H "Authorization: Bearer ${{ secrets.STRIX_LLM_KEY }}" \
            "${{ vars.LLM_API_BASE }}/models/$MODEL/unload" >/dev/null || true

      - name: Alert on findings
        if: failure() && steps.scan.outputs.rc == '2' && steps.preflight.outputs.llm_up == 'true'
        run: |
          curl -s --max-time 15 \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Title: Strix findings - ${{ github.repository }}" \
            -d "Strix flagged security issues on ${{ github.ref_name }} (run ${{ github.run_number }}). Check the job log / strix_runs artifacts." \
            ${{ vars.NTFY_URL }}

      - name: Alert on scan crash
        if: failure() && steps.scan.outputs.rc != '2' && steps.preflight.outputs.llm_up == 'true'
        run: |
          curl -s --max-time 15 \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Title: Strix crashed - ${{ github.repository }}" \
            -d "Strix scan CRASHED on ${{ github.ref_name }} (run ${{ github.run_number }}, rc=${{ steps.scan.outputs.rc }}) — infra/LLM-server error, NOT findings. Check the job log." \
            ${{ vars.NTFY_URL }}

      - name: Alert on LLM-unreachable skip
        if: steps.preflight.outputs.llm_up == 'false'
        run: |
          curl -s --max-time 15 \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Title: Strix skipped - ${{ github.repository }}" \
            -d "Strix scan SKIPPED on ${{ github.ref_name }} (run ${{ github.run_number }}) — LLM host unreachable, scan did not run. Not a crash, not findings." \
            ${{ vars.NTFY_URL }}

      - name: Advisory PR comment on LOW/MEDIUM findings
        if: success() && steps.scan.outputs.rc == '2' && github.event_name == 'pull_request' && steps.preflight.outputs.llm_up == 'true'
        run: |
          printf '%s' '{"body": "\u26a0\ufe0f **Strix advisory** \u2014 findings below the HIGH threshold, so this scan is not blocking the PR.\n\nSeverity: `${{ steps.scan.outputs.severity }}`\n\nFull report is in the job log for run ${{ github.run_number }}. Triage before merge; the local model has a known false-positive rate at LOW/MEDIUM."}' > strix-comment.json
          curl -s --max-time 20 -X POST \
            -H "Authorization: token ${{ secrets.FJ_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-binary @strix-comment.json \
            "${{ vars.FJ_API_BASE }}/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" >/dev/null
